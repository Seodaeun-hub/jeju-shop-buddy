<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254933" />
    <title>연결을 확인해 주세요 · 가게짝꿍</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f6f0; color: #252923; font: 1rem/1.6 system-ui, sans-serif; }
      main { width: min(25rem, calc(100% - 3rem)); padding-block: 2rem; word-break: keep-all; }
      h1 { font-size: 1.6rem; line-height: 1.3; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding-inline: 1rem; border-radius: 7px; background: #254933; color: #fff; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a8400b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>연결되면 내 매장을 다시 열어 POS 파일을 올릴 수 있어요.</p>
      <a href="/stores">내 매장 다시 열기</a>
    </main>
  </body>
</html>
