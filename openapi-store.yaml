  schemas:
    CreateStoreRequest:
      type: object
      additionalProperties: false
      required: [name, address, addressSource, areaCode, industryCode]
      properties:
        name:
          type: string
          maxLength: 100
          pattern: '\S'
        address:
          type: string
          maxLength: 255
          pattern: '\S'
        addressDetail:
          type: string
          maxLength: 100
          pattern: '\S'
        addressSource:
          type: string
          description: SEARCH는 검색 결과 선택, MANUAL은 직접 입력을 뜻한다.
          enum: [SEARCH, MANUAL]
        areaCode:
          type: string
          description: 프로젝트에서 관리하는 제주 읍·면·동 코드
          maxLength: 32
          pattern: '^[A-Z0-9_]+$'
        industryCode:
          type: string
          description: 프로젝트에서 관리하는 업종 코드. 기타 업종은 OTHER.
          maxLength: 32
          pattern: '^[A-Z0-9_]+$'
          enum:
            - KOREAN_RESTAURANT
            - CHINESE_RESTAURANT
            - JAPANESE_RESTAURANT
            - WESTERN_RESTAURANT
            - OTHER_FOREIGN_RESTAURANT
            - PIZZA_BURGER_SANDWICH
            - CAFE
            - BAR
            - BAKERY_RETAIL
            - SUPERMARKET
            - CONVENIENCE_STORE
            - PRODUCE_RETAIL
            - SEAFOOD_RETAIL
            - MEAT_RETAIL
            - SOUVENIR_RETAIL
            - COSMETICS_RETAIL
            - HOTEL
            - MOTEL
            - RESORT_CONDO
            - TRAVEL_AGENCY
            - OTHER
        customIndustryName:
          type: string
          maxLength: 100
          pattern: '\S'
      oneOf:
        - properties:
            industryCode:
              enum: [OTHER]
          required: [customIndustryName]
        - properties:
            industryCode:
              not:
                enum: [OTHER]
          not:
            required: [customIndustryName]
    StoreResponse:
      type: object
      required: [id, name, address, addressSource, areaCode, areaName, industryCode, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        addressDetail:
          type: string
        addressSource:
          type: string
          enum: [SEARCH, MANUAL]
        areaCode:
          type: string
        areaName:
          type: string
        industryCode:
          type: string
        customIndustryName:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateSalesAnalysisRequest:
      type: object
      additionalProperties: false
      required: [monthlySales]
      properties:
        concern:
          type: string
          description: 사업주가 분석할 때 적은 고민
        monthlySales:
          $ref: '#/components/schemas/MonthlySales'
        timeSeries:
          $ref: '#/components/schemas/AnalysisTimeSeries'
        productSales:
          $ref: '#/components/schemas/AnalysisProductSales'
    SalesAnalysisResponse:
      type: object
      required: [id, storeId, beforeMonth, afterMonth, monthlySales, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 새로 저장한 분석 ID
        storeId:
          type: string
          format: uuid
        concern:
          type: string
        beforeMonth:
          $ref: '#/components/schemas/SalesMonth'
        afterMonth:
          $ref: '#/components/schemas/SalesMonth'
        monthlySales:
          $ref: '#/components/schemas/MonthlySales'
        timeSeries:
          $ref: '#/components/schemas/AnalysisTimeSeries'
        productSales:
          $ref: '#/components/schemas/AnalysisProductSales'
        createdAt:
          type: string
          format: date-time
    AnalysisWithSavedTimeSeriesResponse:
      allOf:
        - $ref: '#/components/schemas/SalesAnalysisResponse'
        - type: object
          required: [timeSeries]
          properties:
            timeSeries:
              $ref: '#/components/schemas/AnalysisTimeSeries'
    SalesAnalysisStrategiesResponse:
      type: object
      required: [analysisId, beforeMonth, afterMonth, strategies]
      properties:
        analysisId:
          type: string
          format: uuid
        beforeMonth:
          $ref: '#/components/schemas/SalesMonth'
        afterMonth:
          $ref: '#/components/schemas/SalesMonth'
        recommendationSource:
          type: string
          enum: [AGENT, RULES]
        recommendationId:
          type: string
          format: uuid
          description: 저장된 AI 추천의 ID. 실행 계획을 생성할 때 사용한다.
        contextEvidence:
          type: array
          description: AI 추천의 경기 참고 지표
          items:
            $ref: '#/components/schemas/StrategyEvidence'
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/StrategySuggestion'
    ExecutionGuideSnapshot:
      type: object
      required: [schemaVersion, status, steps, sources, guideId, channel]
      properties:
        guideId: { type: string, format: uuid }
        channel: { type: string, enum: [NAVER, IN_STORE] }
        schemaVersion: { type: string, enum: ['1.0'] }
        status: { type: string, enum: [OK, NO_RELEVANT_GUIDE, CURATED_FALLBACK] }
        message: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            required: [kind, text, sourceIds]
            properties:
              kind: { type: string, enum: [STORE_CHECK, OFFICIAL_GUIDE] }
              text: { type: string }
              when: { type: [string, 'null'] }
              sourceIds:
                type: array
                items: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [id, title, publisher, url, revision]
            properties:
              id: { type: string }
              title: { type: string }
              publisher: { type: string }
              url: { type: string, format: uri }
              revision: { type: integer }
    StrategySuggestion:
      type: object
      required: [code, title, status, reason, evidence, missingInputs, followUp]
      properties:
        code:
          $ref: '#/components/schemas/StrategyCode'
        title:
          type: string
        status:
          type: string
          enum: [RECOMMENDED, AVAILABLE, NEEDS_INPUT]
          description: RECOMMENDED는 우선 제안, AVAILABLE은 검토 가능한 후보, NEEDS_INPUT은 추가 자료가 필요한 후보다.
        reason:
          type: string
          description: 확인한 근거를 바탕으로 해당 행동을 제안하거나 보류한 이유
        executionGuide:
          $ref: '#/components/schemas/ExecutionGuideSnapshot'
        nextAction:
          type: string
          description: AI 추천에서 먼저 확인하거나 입력할 내용
        recommendation:
          type: object
          description: 선택한 AI 추천의 원본 ID와 비교 기간, 경기 참고 지표
          required: [id, beforeMonth, afterMonth, contextEvidence]
          properties:
            id: { type: string, format: uuid }
            beforeMonth: { $ref: '#/components/schemas/SalesMonth' }
            afterMonth: { $ref: '#/components/schemas/SalesMonth' }
            contextEvidence:
              type: array
              items: { $ref: '#/components/schemas/StrategyEvidence' }
        evidence:
          type: array
          description: 저장한 분석에서 확인한 비교 수치. RECOMMENDED 후보에는 근거가 한 건 이상 필요하다.
          items:
            $ref: '#/components/schemas/StrategyEvidence'
        reviewTopic: { $ref: '#/components/schemas/ReviewTopic' }
        reviewEvidence:
          type: array
          description: 리뷰 개선 계획에 저장된 리뷰 원문과 날짜
          items:
            $ref: '#/components/schemas/StoreReview'
        missingInputs:
          type: array
          description: NEEDS_INPUT 후보에 필요한 자료. 필요한 자료가 없으면 빈 배열을 반환한다.
          items:
            type: string
        followUp:
          type: string
          description: 실행 후 확인할 지표나 점검 항목
    ReviewTopic:
      type: string
      enum: [AFTERNOON_ORDER, PARKING, WAIT_TIME]
    StoreReview:
      type: object
      required: [id, date, text]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        text: { type: string }
    StrategyEvidence:
      type: object
      required: [source, metric, before, after]
      properties:
        source:
          type: string
          enum: [MONTHLY_SALES, TIME_SERIES, MARKET_CARD_SALES, JEJU_BSI]
        metric:
          type: string
          enum: [AMOUNT, COUNT, INDEX]
          description: AMOUNT는 원 단위 금액, COUNT는 결제 건수, INDEX는 제주 전체 소상공인 체감 BSI다.
        label:
          type: string
          description: TIME_SERIES 근거에서 사용하는 시간대 이름
        before:
          type: number
          minimum: 0
          description: beforeMonth의 값. 금액과 건수는 정수이며 BSI는 소수일 수 있다.
        after:
          type: number
          minimum: 0
          description: afterMonth의 값. 금액과 건수는 정수이며 BSI는 소수일 수 있다.
    StrategyCode:
      type: string
      enum: [OUTREACH, PROMOTION, INVENTORY]
    CreateExecutionPlanRequest:
      type: object
      additionalProperties: false
      required: [strategyCode, conditions]
      properties:
        executionGuideId:
          type: string
          format: uuid
          description: 주문 안내 카드에서 마지막으로 확인한 실행 가이드 ID
        recommendationId:
          type: string
          format: uuid
          description: AI 추천을 선택할 때 받은 추천 ID
        strategyCode:
          $ref: '#/components/schemas/StrategyCode'
        conditions:
          $ref: '#/components/schemas/ExecutionConditions'
      oneOf:
        - properties:
            strategyCode:
              enum: [OUTREACH, PROMOTION]
            conditions:
              type: object
              required: [budgetWon, channel]
        - properties:
            strategyCode:
              enum: [INVENTORY]
            conditions:
              type: object
              not:
                anyOf:
                  - required: [budgetWon]
                  - required: [channel]
    ExecutionConditions:
      type: object
      additionalProperties: false
      required: [durationWeeks]
      properties:
        durationWeeks:
          type: integer
          enum: [1, 2, 4]
        budgetWon:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 원 단위 예산 한도. 예산을 쓰지 않으면 0을 보낸다.
        channel:
          type: string
          enum: [INSTAGRAM, STORE_NOTICE]
          description: 인스타그램 또는 매장 안내
    ExecutionPlanResponse:
      type: object
      required: [id, analysisId, strategy, conditions, startDate, endDate, checklist, createdAt]
      properties:
        id:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        strategy:
          allOf:
            - $ref: '#/components/schemas/StrategySuggestion'
          description: 계획을 만들 때 선택한 전략과 그때의 근거
        conditions:
          $ref: '#/components/schemas/ExecutionConditions'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        checklist:
          type: array
          minItems: 1
          description: 실행 순서대로 정렬한 체크리스트
          items:
            $ref: '#/components/schemas/ExecutionChecklistItem'
        inventoryItems:
          type: array
          description: 발주 검토 계획에 저장한 품목과 계산 결과
          items:
            $ref: '#/components/schemas/InventoryReviewItem'
        promotionReview:
          $ref: '#/components/schemas/PromotionReview'
        createdAt:
          type: string
          format: date-time
    PromotionReviewInput:
      type: object
      required: [productName, priceWon, costWon, discountWon, budgetWon]
      properties:
        productName: { type: string, minLength: 1, maxLength: 255 }
        priceWon: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, example: 8500 }
        costWon: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, example: 4000 }
        discountWon: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, example: 1000, description: 판매가 이하의 개당 할인액 }
        budgetWon: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, example: 30500 }
    PromotionReview:
      allOf:
        - $ref: '#/components/schemas/PromotionReviewInput'
        - type: object
          required: [discountedPriceWon, marginPerItemWon, maxDiscountQuantity]
          properties:
            discountedPriceWon: { type: integer, format: int64, minimum: 0, example: 7500 }
            marginPerItemWon: { type: integer, format: int64, example: 3500 }
            maxDiscountQuantity: { type: integer, format: int64, minimum: 0, example: 30 }
    InventoryReviewInput:
      type: object
      required: [id, name, unit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50 }
        unit: { type: string, minLength: 1, maxLength: 12 }
        stock: { type: string, example: '8.250' }
        expectedUse: { type: string, example: '15.5' }
        incoming: { type: string, example: '2' }
        finalOrder: { type: string, example: '6' }
      description: 수량은 0 이상 10억 이하의 소수점 셋째 자리까지 입력한다. 미입력 값은 빈 문자열로 저장한다.
    InventoryReviewItem:
      allOf:
        - $ref: '#/components/schemas/InventoryReviewInput'
        - type: object
          properties:
            shortage: { type: number, nullable: true, minimum: 0, example: 5.25 }
    CreateExecutionPlanResultRequest:
      type: object
      additionalProperties: false
      required: [scope, before, after]
      properties:
        scope:
          type: string
          minLength: 1
          maxLength: 100
          description: 두 기간에 공통으로 적용한 요일과 시간대
        before:
          $ref: '#/components/schemas/ExecutionResultPeriod'
        after:
          $ref: '#/components/schemas/ExecutionResultPeriod'
    ExecutionResultPeriod:
      type: object
      additionalProperties: false
      required: [start, end, days]
      anyOf:
        - required: [amount]
        - required: [count]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        days:
          type: integer
          minimum: 1
          description: 공통 요일과 시간대 기준으로 집계에 포함한 영업일 수
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 해당 기간과 시간대의 매출 합계(원)
        count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 해당 기간과 시간대의 결제 건수 합계
    ExecutionPlanResultResponse:
      type: object
      required: [id, planId, scope, before, after, comparison, createdAt]
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        scope:
          type: string
        before:
          $ref: '#/components/schemas/ExecutionResultPeriod'
        after:
          $ref: '#/components/schemas/ExecutionResultPeriod'
        comparison:
          type: object
          description: 두 기간에 입력한 지표만 반환한다.
          properties:
            amount:
              $ref: '#/components/schemas/ExecutionResultMetric'
            count:
              $ref: '#/components/schemas/ExecutionResultMetric'
        createdAt:
          type: string
          format: date-time
    ExecutionResultMetric:
      type: object
      required: [beforeDailyAverage, afterDailyAverage, changeRatePercent]
      properties:
        beforeDailyAverage:
          type: number
          minimum: 0
          description: 실행 전 하루 평균. 소수점 둘째 자리까지 반올림한다.
        afterDailyAverage:
          type: number
          minimum: 0
          description: 조치 적용 후 하루 평균. 소수점 둘째 자리까지 반올림한다.
        changeRatePercent:
          type: number
          nullable: true
          description: 반올림 전 하루 평균으로 계산한 변화율(%). 소수점 둘째 자리까지 반올림하며 실행 전 평균이 0이면 null을 반환한다.
    UpdateExecutionChecklistItemRequest:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed:
          type: boolean
          description: 저장할 완료 상태
    ExecutionChecklistItem:
      type: object
      required: [id, title, dueDate, completed]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueDate:
          type: string
          format: date
        completed:
          type: boolean
          description: 저장된 완료 여부. 계획을 처음 만들 때는 false.
    SalesMonth:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      example: '2021-05'
    MonthlySales:
      type: array
      minItems: 2
      description: 같은 달은 한 번만 입력한다. 응답에서는 월을 오름차순으로 반환한다.
      items:
        type: object
        additionalProperties: false
        required: [month, amount]
        properties:
          month:
            $ref: '#/components/schemas/SalesMonth'
          amount:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
            description: 원 단위 월별 매출 합계
    AnalysisProductSales:
      type: array
      description: 상품 주문 시트에서 결제 완료 건의 수량을 품목별로 합산한 값. 분석의 비교 두 달과 같은 순서다.
      items:
        type: object
        additionalProperties: false
        required: [productName, before, after]
        properties:
          productName: { type: string, minLength: 1, maxLength: 255 }
          before: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
          after: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
    AnalysisTimeSeries:
      type: object
      additionalProperties: false
      required: [metric, rows]
      description: 두 비교 월의 시간대별 합계와 단위
      properties:
        metric:
          type: string
          enum: [AMOUNT, COUNT]
          description: AMOUNT는 원 단위 매출액, COUNT는 결제 건수
        rows:
          type: array
          minItems: 1
          description: 구간 이름은 앞뒤 공백을 제거한 뒤 중복할 수 없다. 입력 순서대로 표시한다.
          items:
            type: object
            additionalProperties: false
            required: [label, before, after]
            properties:
              label:
                type: string
                pattern: '\S'
              before:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
                description: beforeMonth의 해당 구간 합계
              after:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
                description: afterMonth의 해당 구간 합계
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
