openapi: 3.0.3
info:
  title: 가게짝꿍 매장 및 매출 분석 API
  version: 0.24.0
  description: 매장 등록, 매출 분석, 대응 전략 추천, 실행 계획과 체크리스트 관리, 실행 결과 비교·조회·수정·삭제 설계 초안.
paths:
  /api/analyses/{analysisId}/reviews:
    parameters:
      - in: path
        name: analysisId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStoreReviewInsight
      security: [{ ownerBasic: [] }]
      summary: 분석이 연결된 매장의 리뷰와 반복 불편 조회
      responses:
        '200':
          description: 매장 리뷰 건수와 두 건 이상 반복된 주제별 근거 및 개선 조치
          content:
            application/json:
              schema:
                type: object
                required: [total, evidence, repeated, topics]
                properties:
                  total: { type: integer, minimum: 0 }
                  evidence:
                    type: array
                    items: { $ref: '#/components/schemas/StoreReview' }
                  repeated: { type: boolean, description: 기존 오후 주문 안내 불편이 두 건 이상인지 여부 }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [topic, label, title, action, confirmation, evidence]
                      properties:
                        topic: { $ref: '#/components/schemas/ReviewTopic' }
                        label: { type: string }
                        title: { type: string }
                        action: { type: string }
                        confirmation: { type: string }
                        evidence:
                          type: array
                          minItems: 2
                          items: { $ref: '#/components/schemas/StoreReview' }
        '404': { description: 소유한 분석을 찾을 수 없음 }
    post:
      operationId: addStoreReview
      security: [{ ownerBasic: [] }]
      summary: 분석이 연결된 매장에 리뷰 추가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, text]
              properties:
                date: { type: string, format: date }
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: 리뷰 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreReview' }
        '400': { description: 날짜 또는 리뷰 본문 오류 }
        '404': { description: 소유한 분석을 찾을 수 없음 }
  /api/analyses/{analysisId}/review-plans:
    post:
      operationId: createReviewImprovementPlan
      security: [{ ownerBasic: [] }]
      summary: 선택한 반복 불편의 개선 계획 저장
      parameters:
        - in: path
          name: analysisId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true], description: 선택한 개선 조치를 진행할 수 있다는 점주의 확인 }
                topic:
                  allOf:
                    - $ref: '#/components/schemas/ReviewTopic'
                  default: AFTERNOON_ORDER
      responses:
        '201':
          description: 리뷰 근거와 점검표를 포함한 실행 계획 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPlanResponse' }
        '400': { description: 주제가 잘못됐거나 개선 조치 확인이 필요함 }
        '404': { description: 소유한 분석을 찾을 수 없음 }
        '409': { description: 같은 불편을 언급한 리뷰가 두 건 미만 }
  /api/market-context:
    get:
      operationId: getJejuMarketContext
      tags: [매출 분석]
      summary: 두 달의 제주 상권 카드 이용액과 체감 BSI 조회
      description: 읍·면·동과 업종이 같은 카드 이용액을 비교한다. BSI는 제주 전체 소상공인 체감 지표다. 지표별로 두 달 모두 자료가 있을 때 반환한다.
      parameters:
        - in: query
          name: area
          required: true
          schema: { type: string }
        - in: query
          name: industry
          required: true
          schema: { type: string }
        - in: query
          name: beforeMonth
          required: true
          schema: { type: string }
        - in: query
          name: afterMonth
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 조회 가능한 비교 지표
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    type: object
                    required: [before, after]
                    properties:
                      before: { type: integer, format: int64 }
                      after: { type: integer, format: int64 }
                  bsi:
                    type: object
                    required: [before, after]
                    properties:
                      before: { type: number }
                      after: { type: number }
              example:
                card: { before: 2049456994, after: 2199885864 }
                bsi: { before: 63.1, after: 64.4 }
  /api/areas:
    get:
      operationId: listJejuAreas
      tags: [매장]
      summary: 제주 읍·면·동 목록 조회
      responses:
        '200':
          description: 매장 등록에 사용하는 제주 지역 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name]
                  properties:
                    code:
                      type: string
                    name:
                      type: string
              example:
                - code: JEJU_AEWOL
                  name: 제주시 애월읍
  /api/stores:
    get:
      operationId: listOwnerStores
      tags: [매장]
      summary: 로그인한 사업주의 매장 목록 조회
      security:
        - ownerBasic: []
      responses:
        '200':
          description: 사업주 본인의 매장 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreResponse'
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createStore
      tags: [매장]
      summary: 매장 등록
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주의 매장을 등록한다. 사업주 ID는 서버가 로그인 정보에서 확인한다.
        검색 결과를 선택하면 화면이 지역 코드를 채운다. 직접 입력하면 사업주가 제주 읍·면·동을 선택한다.
        서버는 제주 지역 코드와 업종 코드를 검증한다. 직접 입력 요청에는 외부 주소 검색을 호출하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
            examples:
              manual:
                summary: 주소 직접 입력
                value:
                  name: 애월 가상 한식당
                  address: 제주특별자치도 제주시 애월읍 예시로 12
                  addressDetail: 1층
                  addressSource: MANUAL
                  areaCode: JEJU_AEWOL
                  industryCode: KOREAN_RESTAURANT
              search:
                summary: 주소 검색 결과 선택
                value:
                  name: 애월 가상 한식당
                  address: 제주특별자치도 제주시 애월읍 예시로 12
                  addressSource: SEARCH
                  areaCode: JEJU_AEWOL
                  industryCode: KOREAN_RESTAURANT
      responses:
        '201':
          description: 매장 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
              example:
                id: 84c0376e-741f-4e88-b26c-9451c9f515da
                name: 애월 가상 한식당
                address: 제주특별자치도 제주시 애월읍 예시로 12
                addressDetail: 1층
                addressSource: MANUAL
                areaCode: JEJU_AEWOL
                areaName: 제주시 애월읍
                industryCode: KOREAN_RESTAURANT
                createdAt: '2026-11-09T10:00:00+09:00'
        '400':
          description: 필수값 누락 또는 유효하지 않은 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_AREA
                message: 제주 읍·면·동을 선택해 주세요.
                field: areaCode
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 매장을 등록해 주세요.
  /api/stores/{storeId}/analyses:
    get:
      operationId: listStoreAnalyses
      tags: [매출 분석]
      summary: 내 매장의 매출 분석 이력 조회
      description: 최근 저장한 분석부터 반환한다. 분석별 실행 계획과 저장된 결과의 존재 여부를 포함한다.
      security:
        - ownerBasic: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 매출 분석 이력. 분석이 없는 매장은 빈 배열을 반환한다.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, beforeMonth, afterMonth, createdAt, plans]
                  properties:
                    id: { type: string, format: uuid }
                    beforeMonth: { type: string, example: '2021-04' }
                    afterMonth: { type: string, example: '2021-05' }
                    concern: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    plans:
                      type: array
                      items:
                        type: object
                        required: [id, startDate, endDate, hasResult]
                        properties:
                          id: { type: string, format: uuid }
                          title: { type: string, nullable: true }
                          startDate: { type: string, format: date }
                          endDate: { type: string, format: date }
                          hasResult: { type: boolean }
        '401':
          description: 로그인 필요
        '404':
          description: 매장을 찾을 수 없거나 사업주가 소유하지 않은 매장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createSalesAnalysis
      tags: [매출 분석]
      summary: 매장에 매출 분석 저장
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장에 새 분석을 저장한다.
        월별 매출은 서로 다른 두 달 이상 필요하다. 서버는 월별 자료를 오름차순으로 정렬하고
        입력한 월 중 가장 최근 두 달을 비교 기준으로 정한다.
        시간대 자료가 없으면 요청과 응답에서 timeSeries를 생략한다.
        시간대 자료를 보내면 각 구간의 before와 after는 각각 그 두 달의 이전 값과 이후 값이다.
        한 분석에서는 시간대별 매출액과 결제 건수 중 한 단위를 사용한다.
        분석과 하위 자료를 함께 저장한다.
      parameters:
        - name: storeId
          in: path
          required: true
          description: 매장 등록 응답에서 받은 ID
          schema:
            type: string
            format: uuid
          example: 84c0376e-741f-4e88-b26c-9451c9f515da
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesAnalysisRequest'
            examples:
              monthlyOnly:
                summary: 월별 매출만 저장
                value:
                  monthlySales:
                    - { month: '2021-04', amount: 32379500 }
                    - { month: '2021-05', amount: 29581000 }
              withTimeSeries:
                summary: 월별 매출과 시간대별 결제 건수 저장
                value:
                  concern: 평일 오후에 손님이 줄었어요.
                  monthlySales:
                    - { month: '2021-04', amount: 32379500 }
                    - { month: '2021-05', amount: 29581000 }
                  timeSeries:
                    metric: COUNT
                    rows:
                      - { label: 오후 2시 전, before: 248, after: 228 }
                      - { label: 오후 2~5시, before: 233, after: 69 }
                      - { label: 오후 5시 이후, before: 185, after: 165 }
      responses:
        '201':
          description: 매출 분석 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAnalysisResponse'
              examples:
                monthlyOnly:
                  $ref: '#/components/examples/MonthlyOnlyAnalysis'
                withTimeSeries:
                  $ref: '#/components/examples/AnalysisWithTimeSeries'
        '400':
          description: 잘못된 매장 ID 형식, 월별 매출 누락·중복 또는 잘못된 시간대 자료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: DUPLICATE_SALES_MONTH
                message: 같은 달의 매출은 한 번만 입력해 주세요.
                field: monthlySales
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 매출 분석을 저장해 주세요.
        '404':
          description: 매장이 없거나 로그인한 사업주가 소유한 매장이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: STORE_NOT_FOUND
                message: 매장을 찾을 수 없어요.
  /api/analyses/{analysisId}:
    get:
      operationId: getSalesAnalysis
      tags: [매출 분석]
      summary: 저장한 매출 분석 조회
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 분석 기록을 조회한다.
        저장된 비교 월과 월별 매출을 반환한다. 시간대별 자료가 있는 경우 timeSeries를 함께 반환한다.
      parameters:
        - name: analysisId
          in: path
          required: true
          description: 매출 분석 저장 응답의 분석 ID
          schema:
            type: string
            format: uuid
          examples:
            monthlyOnly:
              summary: 월별 매출만 있는 분석 ID
              value: e95a4ada-411a-4d78-91f1-98d198dcf355
            withTimeSeries:
              summary: 시간대별 자료도 있는 분석 ID
              value: 94c5750d-6811-46eb-a6cf-8b36d4149982
      responses:
        '200':
          description: 매출 분석 조회 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAnalysisResponse'
              examples:
                monthlyOnly:
                  $ref: '#/components/examples/MonthlyOnlyAnalysis'
                withTimeSeries:
                  $ref: '#/components/examples/AnalysisWithTimeSeries'
        '400':
          description: 잘못된 분석 ID 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_ANALYSIS_ID
                message: 분석 ID 형식을 확인해 주세요.
                field: analysisId
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 매출 분석을 조회해 주세요.
        '404':
          description: 분석이 없거나 로그인한 사업주가 소유한 매장의 분석이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ANALYSIS_NOT_FOUND
                message: 매출 분석을 찾을 수 없어요.
  /api/analyses/{analysisId}/time-series:
    put:
      operationId: putAnalysisTimeSeries
      tags: [매출 분석]
      summary: 저장한 분석의 시간대별 자료 추가 또는 교체
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 분석에 시간대별 자료를 저장한다.
        before와 after는 이미 저장된 분석의 beforeMonth와 afterMonth에 대응한다.
        요청에 수정 후 남길 전체 구간을 보낸다. 기존 자료가 있으면 지표와 구간 목록을 한 번에 교체한다.
        분석 ID와 월별 매출, 비교 월은 기존 값을 사용한다.
      parameters:
        - name: analysisId
          in: path
          required: true
          description: 시간대별 자료를 추가하거나 교체할 분석 ID
          schema:
            type: string
            format: uuid
          example: e95a4ada-411a-4d78-91f1-98d198dcf355
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisTimeSeries'
            examples:
              firstSave:
                summary: 시간대별 결제 건수 처음 추가
                value:
                  metric: COUNT
                  rows:
                    - { label: 오후 2시 전, before: 248, after: 228 }
                    - { label: 오후 2~5시, before: 233, after: 69 }
              replacement:
                summary: 오후 2~5시의 결제 건수를 정정하고 앞 구간도 유지
                value:
                  metric: COUNT
                  rows:
                    - { label: 오후 2시 전, before: 248, after: 228 }
                    - { label: 오후 2~5시, before: 233, after: 72 }
      responses:
        '201':
          description: 시간대별 자료 최초 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisWithSavedTimeSeriesResponse'
              example:
                id: e95a4ada-411a-4d78-91f1-98d198dcf355
                storeId: 84c0376e-741f-4e88-b26c-9451c9f515da
                beforeMonth: '2021-04'
                afterMonth: '2021-05'
                monthlySales:
                  - { month: '2021-04', amount: 32379500 }
                  - { month: '2021-05', amount: 29581000 }
                timeSeries:
                  metric: COUNT
                  rows:
                    - { label: 오후 2시 전, before: 248, after: 228 }
                    - { label: 오후 2~5시, before: 233, after: 69 }
                createdAt: '2026-11-09T10:05:00+09:00'
        '200':
          description: 기존 시간대별 자료 교체 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisWithSavedTimeSeriesResponse'
              example:
                id: e95a4ada-411a-4d78-91f1-98d198dcf355
                storeId: 84c0376e-741f-4e88-b26c-9451c9f515da
                beforeMonth: '2021-04'
                afterMonth: '2021-05'
                monthlySales:
                  - { month: '2021-04', amount: 32379500 }
                  - { month: '2021-05', amount: 29581000 }
                timeSeries:
                  metric: COUNT
                  rows:
                    - { label: 오후 2시 전, before: 248, after: 228 }
                    - { label: 오후 2~5시, before: 233, after: 72 }
                createdAt: '2026-11-09T10:05:00+09:00'
        '400':
          description: 잘못된 분석 ID 형식 또는 잘못된 시간대 자료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_TIME_SERIES
                message: 시간대별 자료를 한 구간 이상 입력해 주세요.
                field: rows
        '401':
