  /api/analyses/{analysisId}/strategies:
    get:
      operationId: getSalesAnalysisStrategies
      tags: [매출 분석]
      summary: 저장한 매출 분석을 바탕으로 대응 전략 추천
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 분석을 조회하고 대응 전략 후보를 반환한다.
        전략마다 추천 또는 보류 이유와 저장된 분석에서 확인한 비교 수치를 제공한다.
        추가 자료가 필요한 전략은 필요한 입력을 함께 반환한다.
        충분한 근거가 있는 후보가 있을 때만 RECOMMENDED를 사용한다.
        감소한 시간대가 있으면 같은 지표에서 감소 폭이 가장 큰 구간을 주문 안내 점검의 근거로 사용한다.
        시간대 자료가 없거나 감소한 구간이 없으면 월별 비교를 근거로 보여주고 주문 안내 점검은 AVAILABLE로 표시한다.
      parameters:
        - name: analysisId
          in: path
          required: true
          description: 전략 추천에 사용할 저장된 분석 ID
          schema:
            type: string
            format: uuid
          example: 94c5750d-6811-46eb-a6cf-8b36d4149982
      responses:
        '200':
          description: 대응 전략 후보 조회 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAnalysisStrategiesResponse'
              example:
                analysisId: 94c5750d-6811-46eb-a6cf-8b36d4149982
                beforeMonth: '2021-04'
                afterMonth: '2021-05'
                strategies:
                  - code: OUTREACH
                    title: 오후 주문 안내 점검하기
                    status: RECOMMENDED
                    reason: 오후 2~5시 결제 건수가 줄어든 구간부터 실제 주문 가능 시간과 매장 안내가 일치하는지 확인해 보세요.
                    evidence:
                      - source: TIME_SERIES
                        metric: COUNT
                        label: 오후 2~5시
                        before: 233
                        after: 69
                    missingInputs: []
                    followUp: 안내를 수정했다면 같은 요일·시간대의 하루 평균 결제 건수를 비교해요.
                  - code: PROMOTION
                    title: 오후 한정 혜택 검토하기
                    status: NEEDS_INPUT
                    reason: 오후 결제 건수는 줄었어요. 할인안을 제안하려면 주문당 비용과 예산을 먼저 확인해야 해요.
                    evidence:
                      - source: TIME_SERIES
                        metric: COUNT
                        label: 오후 2~5시
                        before: 233
                        after: 69
                    missingInputs: [메뉴별 판매가와 주문당 비용, 할인 예산 한도]
                    followUp: 혜택을 실행하면 결제 건수와 할인 적용 후 주문당 남는 금액을 확인해요.
                  - code: INVENTORY
                    title: 발주량 검토하기
                    status: NEEDS_INPUT
                    reason: 월별 매출이 줄었어요. 발주량은 품목별 재고와 예상 사용량을 확인한 뒤 검토해요.
                    evidence:
                      - source: MONTHLY_SALES
                        metric: AMOUNT
                        before: 32379500
                        after: 29581000
                    missingInputs: [품목별 현재 재고, 다음 입고까지 예상 사용량, 입고 예정량]
                    followUp: 확정 발주량과 실행 후 남은 재고를 같은 단위로 기록해요.
        '400':
          description: 잘못된 분석 ID 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_ANALYSIS_ID
                message: 분석 ID 형식을 확인해 주세요.
                field: analysisId
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 대응 전략을 조회해 주세요.
        '404':
          description: 분석이 없거나 로그인한 사업주가 소유한 매장의 분석이 아님
          content:
