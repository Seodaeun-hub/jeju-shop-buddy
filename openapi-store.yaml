    AnalysisWithTimeSeries:
      summary: 시간대별 결제 건수도 있는 분석
      value:
        id: 94c5750d-6811-46eb-a6cf-8b36d4149982
        storeId: 84c0376e-741f-4e88-b26c-9451c9f515da
