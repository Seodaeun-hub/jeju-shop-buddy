                    title: 오후 식사 주문 가능 시간과 현재 매장 안내 확인
                    dueDate: '2026-11-09'
                    completed: true
                reopen:
                  summary: 미완료로 저장된 항목
                  value:
                    id: 9f74a089-fb9d-4a48-9576-fc81764a8777
                    title: 오후 식사 주문 가능 시간과 현재 매장 안내 확인
                    dueDate: '2026-11-09'
                    completed: false
        '400':
          description: 잘못된 ID 형식 또는 요청 본문
