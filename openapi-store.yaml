        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 체크리스트를 변경해 주세요.
        '404':
          description: 소유한 실행 계획을 찾을 수 없거나 해당 계획에 항목이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                planNotFound:
                  value:
                    code: PLAN_NOT_FOUND
                    message: 실행 계획을 찾을 수 없어요.
                itemNotFound:
                  value:
                    code: CHECKLIST_ITEM_NOT_FOUND
                    message: 이 실행 계획에서 체크리스트 항목을 찾을 수 없어요.
  /api/plans/{planId}/results:
    post:
      operationId: createExecutionPlanResult
      tags: [실행 계획]
      summary: 실행 전후 매출 또는 결제 건수 비교 및 저장
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 실행 계획에 비교 결과 한 건을 저장한다.
        사업주는 실제 조치 적용 전과 적용 후의 같은 요일·시간대를 골라 기간별 합계와 비교한 영업일 수를 입력한다.
        두 기간은 겹치면 안 되며 before.end는 after.start보다 앞서야 한다.
        각 기간의 days는 시작일과 종료일을 포함한 달력 일수 이하여야 한다.
        비교할 지표는 두 기간에 모두 입력해야 하며, 매출과 결제 건수 중 한 가지 이상을 입력한다.
        서버는 합계를 영업일 수로 나눠 하루 평균을 구하고, 반올림 전 평균으로 변화율을 계산한다.
        이 결과는 같은 기준으로 집계한 두 기간의 관측값 비교다.
      parameters:
        - name: planId
          in: path
          required: true
          description: 실행 계획 ID
          schema:
            type: string
            format: uuid
          example: 5be69032-6db8-4211-b7fc-72aa1c339c3d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionPlanResultRequest'
            examples:
              salesOnly:
                summary: 오후 2~5시 매출만 입력
                value:
                  scope: 수~일 오후 2~5시
                  before: { start: '2026-11-04', end: '2026-11-08', days: 5, amount: 740000 }
                  after: { start: '2026-11-11', end: '2026-11-15', days: 5, amount: 860000 }
              countOnly:
                summary: 오후 2~5시 결제 건수만 입력
                value:
                  scope: 수~일 오후 2~5시
                  before: { start: '2026-11-04', end: '2026-11-08', days: 5, count: 25 }
                  after: { start: '2026-11-11', end: '2026-11-15', days: 5, count: 32 }
      responses:
        '201':
          description: 실행 결과 비교 및 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPlanResultResponse'
              examples:
                salesOnly:
                  $ref: '#/components/examples/ExecutionResultSalesOnly'
                countOnly:
                  $ref: '#/components/examples/ExecutionResultCountOnly'
        '400':
          description: 잘못된 계획 ID 형식, 비교 기간, 영업일 수 또는 지표 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_PLAN_RESULT
                message: 결제 건수를 비교하려면 두 기간에 모두 입력해 주세요.
                field: after.count
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 실행 결과를 저장해 주세요.
        '404':
          description: 실행 계획이 없거나 로그인한 사업주가 소유한 매장의 계획이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PLAN_NOT_FOUND
                message: 실행 계획을 찾을 수 없어요.
    get:
      operationId: getLatestExecutionPlanResult
      tags: [실행 계획]
      summary: 가장 최근에 저장한 실행 결과 조회
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 실행 계획에서 가장 최근에 저장한 비교 결과 한 건을 반환한다.
        최근 결과는 처음 등록한 순서로 판단한다. 등록한 결과를 수정해도 이 순서는 유지한다.
        최신 결과가 삭제되면 남은 결과 중 가장 최근에 등록한 결과를 반환한다.
        저장된 기간, 합계, 하루 평균, 변화율을 반환하며 비교 결과에는 저장한 지표만 포함한다.
      parameters:
        - name: planId
          in: path
          required: true
          description: 실행 계획 ID
          schema:
            type: string
            format: uuid
          example: 5be69032-6db8-4211-b7fc-72aa1c339c3d
      responses:
        '200':
          description: 저장한 실행 결과 조회 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPlanResultResponse'
              examples:
                salesOnly:
                  $ref: '#/components/examples/ExecutionResultSalesOnly'
                countOnly:
                  $ref: '#/components/examples/ExecutionResultCountOnly'
        '204':
          description: 실행 계획은 있지만 저장된 결과가 없음. 마지막 결과를 삭제한 경우도 포함하며, 응답 본문 없이 결과 입력을 안내한다.
        '400':
          description: 잘못된 실행 계획 ID 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_PLAN_ID
                message: 실행 계획 ID 형식을 확인해 주세요.
                field: planId
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 실행 결과를 조회해 주세요.
        '404':
          description: 실행 계획이 없거나 로그인한 사업주가 소유한 매장의 계획이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PLAN_NOT_FOUND
                message: 실행 계획을 찾을 수 없어요.
  /api/plans/{planId}/results/{resultId}:
    put:
      operationId: replaceExecutionPlanResult
      tags: [실행 계획]
      summary: 실행 결과 수정 및 비교 지표 재계산
      security:
        - ownerBasic: []
      description: >
        로그인한 사업주가 소유한 매장의 실행 계획에서 지정한 결과의 입력값 전체를 교체한다.
        수정 후 적용할 비교 기준, 실행 전·후 기간과 영업일 수를 함께 보내고, 비교할 지표를 두 기간에 모두 넣는다.
        매출과 결제 건수 중 하나 이상은 필요하다. 기존에 저장한 지표를 두 기간에서 모두 빼면 수정 결과에서도 제외된다.
        두 기간은 겹치면 안 되며 before.end는 after.start보다 앞서야 한다.
        각 기간의 days는 시작일과 종료일을 포함한 달력 일수 이하여야 한다.
        서버는 수정한 합계를 영업일 수로 나눠 하루 평균을 다시 구하고, 반올림 전 평균으로 변화율을 다시 계산한다.
        실행 전 평균이 0이면 해당 지표의 변화율은 null이다.
        수정한 입력값과 계산값은 함께 저장하며, 결과 ID와 최초 생성 시각은 유지한다.
      parameters:
        - name: planId
          in: path
          required: true
          description: 실행 계획 ID
          schema:
            type: string
            format: uuid
          example: 5be69032-6db8-4211-b7fc-72aa1c339c3d
        - name: resultId
          in: path
          required: true
          description: 실행 결과 저장 또는 조회 응답의 id
          schema:
            type: string
            format: uuid
          examples:
            correctSales:
              value: 14b7aa16-b282-4dc1-9a3d-86ae1782c60d
            correctCount:
              value: 16cf2a57-39c8-40eb-b8db-ed75a2c8f1b0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionPlanResultRequest'
            examples:
              correctSales:
                summary: 실행 후 매출 합계를 860000원에서 814000원으로 수정
                value:
                  scope: 수~일 오후 2~5시
                  before: { start: '2026-11-04', end: '2026-11-08', days: 5, amount: 740000 }
                  after: { start: '2026-11-11', end: '2026-11-15', days: 5, amount: 814000 }
              correctCount:
                summary: 실행 후 결제 건수 합계를 32건에서 30건으로 수정
                value:
                  scope: 수~일 오후 2~5시
                  before: { start: '2026-11-04', end: '2026-11-08', days: 5, count: 25 }
                  after: { start: '2026-11-11', end: '2026-11-15', days: 5, count: 30 }
      responses:
        '200':
          description: 실행 결과 수정 및 재계산 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPlanResultResponse'
              examples:
                correctSales:
                  summary: 수정 후 하루 평균 매출과 변화율
                  value:
                    id: 14b7aa16-b282-4dc1-9a3d-86ae1782c60d
                    planId: 5be69032-6db8-4211-b7fc-72aa1c339c3d
                    scope: 수~일 오후 2~5시
                    before: { start: '2026-11-04', end: '2026-11-08', days: 5, amount: 740000 }
                    after: { start: '2026-11-11', end: '2026-11-15', days: 5, amount: 814000 }
                    comparison:
                      amount: { beforeDailyAverage: 148000, afterDailyAverage: 162800, changeRatePercent: 10 }
                    createdAt: '2026-11-16T10:20:00+09:00'
                correctCount:
                  summary: 수정 후 하루 평균 결제 건수와 변화율
                  value:
                    id: 16cf2a57-39c8-40eb-b8db-ed75a2c8f1b0
                    planId: 5be69032-6db8-4211-b7fc-72aa1c339c3d
                    scope: 수~일 오후 2~5시
                    before: { start: '2026-11-04', end: '2026-11-08', days: 5, count: 25 }
                    after: { start: '2026-11-11', end: '2026-11-15', days: 5, count: 30 }
                    comparison:
                      count: { beforeDailyAverage: 5, afterDailyAverage: 6, changeRatePercent: 20 }
                    createdAt: '2026-11-16T10:25:00+09:00'
        '400':
          description: 잘못된 ID 형식, 비교 기간, 영업일 수 또는 지표 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_PLAN_RESULT
                message: 결제 건수를 비교하려면 두 기간에 모두 입력해 주세요.
                field: after.count
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 실행 결과를 수정해 주세요.
        '404':
          description: 소유한 실행 계획을 찾을 수 없거나 해당 계획에 결과가 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                planNotFound:
                  value:
                    code: PLAN_NOT_FOUND
                    message: 실행 계획을 찾을 수 없어요.
                resultNotFound:
                  value:
                    code: PLAN_RESULT_NOT_FOUND
                    message: 이 실행 계획에서 수정할 결과를 찾을 수 없어요.
    delete:
      operationId: deleteExecutionPlanResult
      tags: [실행 계획]
      summary: 저장한 실행 결과 삭제
      security:
        - ownerBasic: []
      description: |
        로그인한 사업주가 소유한 매장의 실행 계획에서 지정한 결과 한 건을 삭제한다.

        삭제한 뒤에는 `GET /api/plans/{planId}/results`로 화면에 표시할 결과를 다시 조회한다.

        - 기존 예시에서 가장 최근에 등록한 결제 건수 결과를 삭제하고 매출 결과가 남아 있다면, 조회는 `200 OK`와 함께 매출 결과를 반환한다. 조회의 `salesOnly` 응답 예시에서 실행 후 하루 평균 매출은 172,000원이고 변화율은 16.22%다.
        - 마지막 결과까지 삭제하면 조회는 본문 없이 `204 No Content`를 반환한다. 화면에는 결과 입력 폼을 표시한다.
      parameters:
        - name: planId
          in: path
          required: true
          description: 실행 계획 ID
          schema:
            type: string
            format: uuid
          example: 5be69032-6db8-4211-b7fc-72aa1c339c3d
        - name: resultId
          in: path
          required: true
          description: 삭제할 실행 결과 ID
          schema:
            type: string
            format: uuid
          example: 16cf2a57-39c8-40eb-b8db-ed75a2c8f1b0
      responses:
        '204':
          description: 삭제 완료. 응답 본문 없음.
        '400':
          description: 잘못된 실행 계획 ID 또는 결과 ID 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_PLAN_RESULT_ID
                message: 실행 결과 ID 형식을 확인해 주세요.
                field: resultId
        '401':
          description: 로그인이 필요한 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_REQUIRED
                message: 로그인 후 실행 결과를 삭제해 주세요.
        '404':
          description: 소유한 실행 계획을 찾을 수 없거나 해당 계획에 결과가 없음. 이미 삭제된 결과도 포함한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                planNotFound:
                  value:
                    code: PLAN_NOT_FOUND
                    message: 실행 계획을 찾을 수 없어요.
                resultNotFound:
                  value:
                    code: PLAN_RESULT_NOT_FOUND
                    message: 이 실행 계획에서 삭제할 결과를 찾을 수 없어요.
components:
  securitySchemes:
    ownerBasic:
      type: http
      scheme: basic
      description: 등록된 사업주의 이메일과 비밀번호로 인증한다.
  examples:
    ExecutionResultSalesOnly:
      summary: 하루 평균 매출과 변화율
      value:
        id: 14b7aa16-b282-4dc1-9a3d-86ae1782c60d
        planId: 5be69032-6db8-4211-b7fc-72aa1c339c3d
        scope: 수~일 오후 2~5시
        before: { start: '2026-11-04', end: '2026-11-08', days: 5, amount: 740000 }
        after: { start: '2026-11-11', end: '2026-11-15', days: 5, amount: 860000 }
        comparison:
          amount: { beforeDailyAverage: 148000, afterDailyAverage: 172000, changeRatePercent: 16.22 }
        createdAt: '2026-11-16T10:20:00+09:00'
    ExecutionResultCountOnly:
      summary: 하루 평균 결제 건수와 변화율
      value:
        id: 16cf2a57-39c8-40eb-b8db-ed75a2c8f1b0
        planId: 5be69032-6db8-4211-b7fc-72aa1c339c3d
        scope: 수~일 오후 2~5시
        before: { start: '2026-11-04', end: '2026-11-08', days: 5, count: 25 }
        after: { start: '2026-11-11', end: '2026-11-15', days: 5, count: 32 }
        comparison:
          count: { beforeDailyAverage: 5, afterDailyAverage: 6.4, changeRatePercent: 28 }
        createdAt: '2026-11-16T10:25:00+09:00'
    MonthlyOnlyAnalysis:
      summary: 월별 매출만 있는 분석
      value:
